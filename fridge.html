<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fridge POV</title>
    <style>
        :root {
            --light-opacity: 0.92;
            --light-hue: 202deg;
            --fan-speed: 1.6s;
            --fan-opacity: 0.75;
            --vibe: 0;
            --grain-opacity: 0.22;
            --door-close: 0;
            --door-angle: 0deg;
            --cam-x: 0deg;
            --cam-y: 0deg;
            --cam-z: -290px;
            --cam-off-x: 0px;
            --cam-off-y: 0px;
            --aberration: 0px;
            --depth-scale: 1;
            --depth-fog: 0.18;
            --near-shadow: 0.55;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #02070d;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        }

        .screen {
            position: fixed;
            inset: 0;
            perspective: 440px;
            perspective-origin: 50% 49%;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 0%, rgba(185, 223, 245, 0.18), transparent 30%),
                radial-gradient(circle at 50% 110%, rgba(0, 0, 0, 0.6), transparent 40%),
                #050a10;
            backdrop-filter: blur(0.02px);
        }

        .camera {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            will-change: transform;
            transform: translate3d(var(--cam-off-x), var(--cam-off-y), var(--cam-z)) rotateX(var(--cam-x)) rotateY(var(--cam-y));
        }

        .cavity {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(134vw, 1760px);
            aspect-ratio: 1.04;
            transform-style: preserve-3d;
            transform: translate3d(-50%, -50%, -310px) scale(var(--depth-scale));
            filter: saturate(0.86) contrast(1.14);
        }

        .cavity::before,
        .cavity::after {
            content: '';
            position: absolute;
            left: 9.5%;
            width: 81%;
            border-radius: 28px;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        /* Foreground aperture lip to create true near-field depth */
        .cavity::before {
            top: 7%;
            height: 86%;
            transform: translateZ(296px);
            border: 24px solid rgba(191, 201, 210, 0.42);
            box-shadow:
                inset 0 0 26px rgba(255, 255, 255, 0.18),
                inset 0 0 80px rgba(0, 0, 0, calc(var(--near-shadow) * 0.7)),
                0 8px 25px rgba(0, 0, 0, 0.48);
            backdrop-filter: blur(0.3px);
        }

        /* Deep tunnel vignette inside the cavity */
        .cavity::after {
            top: 7%;
            height: 86%;
            transform: translateZ(110px);
            background: radial-gradient(circle at 50% 45%, transparent 28%, rgba(7, 13, 18, 0.5) 100%);
            mix-blend-mode: multiply;
            opacity: 0.85;
        }

        .wall {
            position: absolute;
            border-radius: 30px;
            background:
                linear-gradient(170deg, #f2f6f9 0%, #dbe2e8 48%, #aeb9c4 100%),
                radial-gradient(circle at 60% 10%, rgba(255, 255, 255, 0.65), transparent 28%);
            box-shadow:
                inset 0 0 90px rgba(90, 111, 126, 0.42),
                inset 0 -45px 70px rgba(40, 55, 68, 0.35);
            overflow: hidden;
        }

        .wall::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 14% 24%, rgba(105, 68, 38, 0.22), transparent 22%),
                radial-gradient(circle at 82% 61%, rgba(127, 79, 42, 0.2), transparent 25%),
                linear-gradient(0deg, rgba(59, 70, 78, 0.25) 0%, transparent 26%),
                repeating-linear-gradient(96deg, rgba(255, 255, 255, 0.04) 0 2px, rgba(0, 0, 0, 0.04) 2px 4px);
            mix-blend-mode: multiply;
            opacity: 0.75;
        }

        .back {
            inset: 7% 9.5%;
            background:
                radial-gradient(circle at 50% 22%, hsla(var(--light-hue), 82%, 90%, calc(var(--light-opacity) * 0.45)), transparent 37%),
                linear-gradient(180deg, #f5f8fa 0%, #dce4ea 56%, #c2cfd9 100%);
            box-shadow: 
                inset 0 0 120px rgba(0, 0, 0, 0.25),
                inset 45px 0 80px rgba(0, 0, 0, 0.12),
                inset -45px 0 80px rgba(0, 0, 0, 0.12);
            filter: blur(1.5px);
        }

        .back::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, transparent 0 19%, rgba(99, 115, 126, 0.12) 19% 20%, transparent 20% 80%, rgba(99, 115, 126, 0.12) 80% 81%, transparent 81% 100%),
                linear-gradient(0deg, transparent 0 86%, rgba(61, 82, 98, 0.16) 86% 87%, transparent 87% 100%);
            opacity: 0.55;
        }

        .left,
        .right {
            width: 16%;
            height: 86%;
            top: 7%;
            border-radius: 24px;
        }

        .left {
            left: 9.5%;
            transform-origin: left center;
            transform: rotateY(79deg) translateZ(10px);
            box-shadow: inset 18px 0 45px rgba(0, 0, 0, 0.35), inset -2px 0 20px rgba(255, 255, 255, 0.1);
        }

        .right {
            right: 9.5%;
            transform-origin: right center;
            transform: rotateY(-79deg) translateZ(10px);
            box-shadow: inset -18px 0 45px rgba(0, 0, 0, 0.35), inset 2px 0 20px rgba(255, 255, 255, 0.08);
        }

        .ceiling,
        .floor {
            width: 81%;
            height: 14%;
            left: 9.5%;
            border-radius: 24px;
        }

        .ceiling {
            top: 7%;
            transform-origin: center top;
            transform: rotateX(-74deg) translateZ(12px);
            box-shadow: inset 0 -28px 50px rgba(0, 0, 0, 0.3), inset 0 2px 15px rgba(255, 255, 255, 0.08);
        }

        .floor {
            bottom: 7%;
            transform-origin: center bottom;
            transform: rotateX(74deg) translateZ(12px);
            box-shadow: inset 0 28px 50px rgba(0, 0, 0, 0.4), inset 0 -2px 15px rgba(255, 255, 255, 0.05);
        }

        .gasket {
            position: absolute;
            border-radius: 10px;
            background: linear-gradient(180deg, #cad2da, #8f9ca8);
            box-shadow:
                inset 0 1px 4px rgba(255, 255, 255, 0.6),
                inset 0 -2px 7px rgba(30, 43, 54, 0.45),
                0 0 12px rgba(0, 0, 0, 0.36);
            transform: translateZ(255px);
        }

        .gasket.top,
        .gasket.bottom {
            width: 81%;
            height: 2.3%;
            left: 9.5%;
        }

        .gasket.top { top: 8.4%; }
        .gasket.bottom { bottom: 8.4%; }

        .gasket.left,
        .gasket.right {
            width: 2.2%;
            height: 84.2%;
            top: 7.9%;
        }

        .gasket.left { left: 9.5%; }
        .gasket.right { right: 9.5%; }

        .lamp {
            position: absolute;
            width: 31%;
            height: 5%;
            left: 34.5%;
            top: 10.5%;
            border-radius: 999px;
            transform: translateZ(185px);
            background:
                linear-gradient(90deg, rgba(235, 243, 248, 0.5), rgba(255, 255, 255, 0.95), rgba(235, 243, 248, 0.5));
            box-shadow:
                0 0 85px hsla(var(--light-hue), 95%, 84%, calc(var(--light-opacity) * 0.98)),
                0 0 150px hsla(var(--light-hue), 95%, 85%, calc(var(--light-opacity) * 0.4)),
                inset 0 0 10px rgba(255, 255, 255, 0.9);
            opacity: var(--light-opacity);
        }

        .shelf {
            position: absolute;
            left: 12.4%;
            width: 75.2%;
            height: 3.4%;
            border-radius: 14px;
            transform: translateZ(170px) rotateX(79deg);
            background:
                linear-gradient(180deg, rgba(236, 246, 252, 0.66), rgba(170, 194, 211, 0.2));
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow:
                0 8px 20px rgba(25, 45, 61, 0.35),
                inset 0 -8px 10px rgba(96, 127, 148, 0.2);
            overflow: hidden;
            filter: blur(0.4px);
        }

        .shelf::after {
            content: '';
            position: absolute;
            inset: -18% 1% auto;
            height: 34%;
            border-radius: 10px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.52), transparent);
        }

        .shelf.top { top: 30%; }
        .shelf.mid { top: 48%; }
        .shelf.low { top: 66%; }

        .drawer {
            position: absolute;
            width: 72%;
            height: 12%;
            left: 14%;
            top: 76%;
            transform: translateZ(145px) rotateX(79deg);
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(231, 244, 251, 0.65), rgba(125, 165, 191, 0.2));
            border: 1px solid rgba(255, 255, 255, 0.48);
            box-shadow: inset 0 -20px 24px rgba(52, 82, 105, 0.28);
        }

        .fan {
            position: absolute;
            width: 16%;
            aspect-ratio: 1;
            left: 42%;
            top: 20%;
            transform: translateZ(3px);
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 50%, rgba(20, 35, 46, 0.4) 0 24%, rgba(88, 114, 132, 0.45) 24% 48%, rgba(173, 196, 212, 0.5) 49% 62%, transparent 62%);
            box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.23);
            opacity: var(--fan-opacity);
        }

        .fan::before {
            content: '';
            position: absolute;
            inset: 19%;
            border-radius: 50%;
            background:
                conic-gradient(from 0deg, rgba(44, 65, 82, 0.94) 0 20%, rgba(175, 201, 220, 0.2) 20% 33%, rgba(44, 65, 82, 0.9) 33% 54%, rgba(175, 201, 220, 0.2) 54% 68%, rgba(44, 65, 82, 0.88) 68% 86%, rgba(175, 201, 220, 0.2) 86% 100%);
            animation: spin var(--fan-speed) linear infinite;
            filter: blur(0.3px);
        }

        .door {
            position: absolute;
            width: 36%;
            height: 86%;
            top: 7%;
            right: 8.8%;
            transform-origin: right center;
            transform-style: preserve-3d;
            transform: translateZ(267px) rotateY(calc(-62deg + var(--door-angle)));
            animation: door-idle 9s ease-in-out infinite;
        }

        @keyframes door-idle {
            0%, 100% { transform: translateZ(267px) rotateY(-62deg); }
            50% { transform: translateZ(267px) rotateY(-60deg); }
        }

        .door-panel {
            position: absolute;
            inset: 0;
            border-radius: 18px;
            background:
                linear-gradient(165deg, #e9eef2 0%, #a5b4c0 100%);
            border: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow:
                inset 0 0 35px rgba(84, 110, 130, 0.35),
                0 18px 30px rgba(11, 21, 28, 0.46);
        }

        .door-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 18px;
            background:
                radial-gradient(circle at 18% 80%, rgba(122, 76, 41, 0.24), transparent 28%),
                radial-gradient(circle at 82% 20%, rgba(98, 58, 29, 0.19), transparent 20%),
                repeating-linear-gradient(100deg, rgba(255, 255, 255, 0.03) 0 3px, rgba(0, 0, 0, 0.04) 3px 6px);
            mix-blend-mode: multiply;
            opacity: 0.86;
        }

        .bin {
            position: absolute;
            left: 10%;
            width: 80%;
            height: 17%;
            border-radius: 12px;
            background:
                linear-gradient(180deg, rgba(231, 245, 251, 0.54), rgba(130, 170, 197, 0.26));
            border: 1px solid rgba(255, 255, 255, 0.52);
            box-shadow: inset 0 -12px 14px rgba(58, 90, 114, 0.26);
            overflow: hidden;
        }

        .bin::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 80%, rgba(91, 56, 32, 0.25), transparent 22%),
                radial-gradient(circle at 78% 20%, rgba(94, 60, 35, 0.2), transparent 20%);
            opacity: 0.55;
        }

        .bin.one { top: 15%; }
        .bin.two { top: 40%; }
        .bin.three { top: 65%; }

        .bin-item {
            position: absolute;
            bottom: 12%;
            width: 24%;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 10px 14px rgba(27, 47, 62, 0.35);
        }

        .bin-item.a {
            left: 8%;
            height: 58%;
            background: linear-gradient(180deg, #fbe8cf, #cb8b42);
        }

        .bin-item.b {
            left: 38%;
            height: 68%;
            background: linear-gradient(180deg, #d9ecf7, #6c9fbe);
        }

        .bin-item.c {
            left: 68%;
            height: 50%;
            background: linear-gradient(180deg, #d9edd8, #6ca06d);
        }

        .food {
            position: absolute;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 14px 18px rgba(17, 29, 40, 0.35);
            transform-style: preserve-3d;
        }

        .food.milk {
            width: 9%;
            height: 22%;
            left: 22%;
            top: 43%;
            transform: translateZ(212px);
            background: linear-gradient(180deg, #f4f8fb, #c6d5df 82%);
        }

        .food.soda {
            width: 6%;
            height: 20%;
            left: 36%;
            top: 58%;
            transform: translateZ(196px);
            background: linear-gradient(180deg, #f6e460, #c5871f 90%);
        }

        .food.container {
            width: 14%;
            height: 12%;
            left: 65%;
            top: 38%;
            transform: translateZ(205px);
            background: linear-gradient(150deg, #f9fbfd, #9fb2c2);
        }

        .food.greens {
            width: 13%;
            height: 10%;
            left: 20%;
            top: 76.5%;
            transform: translateZ(186px);
            border-radius: 14px;
            background: linear-gradient(140deg, #9ce58a, #3f9756);
        }

        .thermostat {
            position: absolute;
            width: 8.6%;
            height: 15.5%;
            left: 12.2%;
            top: 14.2%;
            transform: translateZ(195px);
            border-radius: 8px;
            background: linear-gradient(180deg, #e6ddd0, #b8aa98);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: inset 0 -8px 10px rgba(64, 52, 40, 0.2), 0 10px 16px rgba(8, 16, 22, 0.35);
        }

        .dial {
            position: absolute;
            width: 68%;
            aspect-ratio: 1;
            left: 16%;
            top: 14%;
            border-radius: 50%;
            border: 2px solid rgba(95, 76, 58, 0.55);
            background:
                radial-gradient(circle at 50% 50%, #faf6ef 0 58%, #d2c6b8 58% 62%, #f2e8dc 62% 100%);
            box-shadow: inset 0 0 4px rgba(85, 63, 43, 0.35);
        }

        .dial::before {
            content: '';
            position: absolute;
            width: 5%;
            height: 43%;
            left: 47.5%;
            top: 12%;
            border-radius: 999px;
            background: #7f2c24;
            transform: rotate(22deg);
            transform-origin: 50% 92%;
        }

        .freezer-box {
            position: absolute;
            width: 43%;
            height: 24%;
            left: 36%;
            top: 13.7%;
            transform: translateZ(178px);
            border-radius: 30px;
            background:
                radial-gradient(circle at 50% 40%, rgba(216, 205, 221, 0.65), rgba(148, 124, 146, 0.72) 70%, rgba(102, 81, 100, 0.7) 100%);
            box-shadow:
                inset 0 0 24px rgba(36, 26, 42, 0.45),
                inset 0 -16px 20px rgba(20, 12, 24, 0.35),
                0 18px 22px rgba(9, 14, 20, 0.45);
            overflow: hidden;
        }

        .freezer-box::before {
            content: '';
            position: absolute;
            inset: -9% -5%;
            border-radius: 32px;
            border: 15px solid rgba(235, 240, 246, 0.92);
            box-shadow:
                inset 0 0 9px rgba(255, 255, 255, 0.9),
                0 0 12px rgba(214, 225, 238, 0.85);
            filter: blur(0.3px);
        }

        .freezer-box::after {
            content: '';
            position: absolute;
            inset: 12% 8%;
            border-radius: 26px;
            border: 1px solid rgba(255, 255, 255, 0.26);
            background:
                radial-gradient(circle at 30% 32%, rgba(235, 237, 244, 0.26), transparent 35%),
                radial-gradient(circle at 70% 70%, rgba(186, 163, 190, 0.2), transparent 35%);
        }

        .wire-shelf {
            position: absolute;
            width: 76%;
            height: 16%;
            left: 12%;
            top: 60%;
            transform: translateZ(156px) rotateX(79deg);
            border-radius: 10px;
            background:
                repeating-linear-gradient(90deg, rgba(222, 230, 237, 0.82) 0 3px, transparent 3px 22px),
                linear-gradient(180deg, rgba(180, 192, 202, 0.2), rgba(108, 126, 140, 0.2));
            box-shadow: 0 14px 16px rgba(10, 21, 29, 0.35);
        }

        .grime-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 12% 88%, rgba(52, 36, 19, 0.34), transparent 18%),
                radial-gradient(circle at 85% 82%, rgba(60, 39, 16, 0.28), transparent 20%),
                radial-gradient(circle at 54% 32%, rgba(130, 145, 152, 0.22), transparent 26%),
                repeating-linear-gradient(110deg, rgba(0, 0, 0, 0.03) 0 2px, rgba(255, 255, 255, 0.02) 2px 4px);
            mix-blend-mode: multiply;
            opacity: 0.82;
        }

        .grain {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0.7px, transparent 0.8px);
            background-size: 3px 3px;
            opacity: var(--grain-opacity);
            mix-blend-mode: soft-light;
        }

        .chromatic {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.38;
            mix-blend-mode: screen;
            background:
                radial-gradient(circle at calc(50% - var(--aberration)), 50%, rgba(255, 74, 74, 0.11), transparent 62%),
                radial-gradient(circle at calc(50% + var(--aberration)), 50%, rgba(54, 164, 255, 0.11), transparent 62%);
        }

        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 52%, transparent 46%, rgba(0, 0, 0, 0.72) 100%);
        }

        .depth-field {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(0deg, rgba(2, 7, 13, calc(var(--depth-fog) * 0.8)) 0%, transparent 24%, transparent 76%, rgba(2, 7, 13, calc(var(--depth-fog) * 0.45)) 100%);
            mix-blend-mode: multiply;
            opacity: 0.6;
        }

        .distance-haze {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center 30%, transparent 0%, rgba(10, 20, 28, calc(var(--depth-fog) + 0.08)) 100%);
            mix-blend-mode: overlay;
            opacity: 0.5;
        }

        .door-shadow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(90deg, transparent 35%, rgba(3, 6, 10, 0.98) 78%);
            transform: translateX(calc(var(--door-close) * 58%));
            transition: transform 0.28s cubic-bezier(0.18, 0.73, 0.23, 1.05);
        }

        .pulse-smooth .lamp {
            animation: pulse-smooth 1.2s ease-in-out infinite;
        }

        .flicker-gentle .lamp {
            animation: flicker-gentle 0.35s steps(5, end) infinite;
        }

        .flicker-stutter .lamp {
            animation: flicker-stutter 0.28s steps(7, end) infinite;
        }

        .flicker-irregular .lamp {
            animation: flicker-irregular 0.42s steps(9, end) infinite;
        }

        .pulse-melancholic .lamp {
            animation: pulse-melancholic 2.1s ease-in-out infinite;
        }

        .flicker-sharp .lamp {
            animation: flicker-sharp 0.18s steps(8, end) infinite;
        }

        .flicker-aggressive .lamp {
            animation: flicker-aggressive 0.11s steps(11, end) infinite;
        }

        .strobe .lamp {
            animation: strobe 0.06s steps(2, end) infinite;
        }

        .flicker-flutter .lamp {
            animation: flicker-flutter 0.38s steps(8, end) infinite;
        }

        .pulse-reflect .lamp {
            animation: pulse-reflect 1.8s ease-in-out infinite;
        }

        .shutdown .lamp {
            animation: none;
            opacity: 0.02;
            box-shadow: none;
        }

        .shutdown .fan::before {
            animation-play-state: paused;
        }

        .rattle .cavity {
            animation: rattle 0.08s linear infinite;
        }

        .shiver .cavity {
            animation: shiver 0.28s ease-in-out infinite;
        }

        .input-shell {
            position: fixed;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            z-index: 30;
            width: min(320px, 72vw);
            border-radius: 12px;
            border: 1px solid rgba(216, 239, 255, 0.38);
            background: rgba(209, 232, 247, 0.16);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px) saturate(1.2);
            overflow: hidden;
        }

        .input-shell input {
            width: 100%;
            border: 0;
            outline: none;
            color: rgba(242, 249, 255, 0.9);
            background: transparent;
            padding: 9px 12px;
            font-size: 12px;
            letter-spacing: 0.02em;
        }

        .input-shell input::placeholder {
            color: transparent;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* FLICKER PATTERNS FOR EMOTIONS */
        
        @keyframes pulse-smooth {
            0%, 100% { opacity: 0.88; }
            50% { opacity: 0.96; }
        }

        @keyframes flicker-gentle {
            0%, 100% { opacity: 0.90; }
            20% { opacity: 0.85; }
            40% { opacity: 0.92; }
            60% { opacity: 0.87; }
            80% { opacity: 0.94; }
        }

        @keyframes flicker-stutter {
            0%, 100% { opacity: 0.70; }
            10% { opacity: 0.40; }
            20% { opacity: 0.72; }
            30% { opacity: 0.35; }
            50% { opacity: 0.75; }
            70% { opacity: 0.38; }
            90% { opacity: 0.72; }
        }

        @keyframes flicker-irregular {
            0% { opacity: 0.60; }
            8% { opacity: 0.45; }
            16% { opacity: 0.65; }
            24% { opacity: 0.42; }
            32% { opacity: 0.68; }
            48% { opacity: 0.50; }
            64% { opacity: 0.62; }
            72% { opacity: 0.38; }
            88% { opacity: 0.60; }
            100% { opacity: 0.58; }
        }

        @keyframes pulse-melancholic {
            0%, 100% { opacity: 0.50; }
            50% { opacity: 0.42; }
        }

        @keyframes flicker-sharp {
            0%, 100% { opacity: 0.62; }

        function choose(message) {

            // Happy, Ecstatic, Agreement
            if (/(thank|thanks|love|awesome|great|perfect|amazing|excellent|wonderful|best|brilliant)/.test(m)) return 'ecstatic';
            if (/(yes|agree|right|correct|true|indeed|absolutely|exactly|indeed|makes sense)/.test(m)) return 'agreeing';
            if (/(salad|veg|greens|healthy|fruit|water|protein|balanced|nutrition|good food)/.test(m)) return 'happy';
            
            // Annoyed, Upset, Disagreeing
            if (/(no|wrong|incorrect|false|disagree|nonsense|ridiculous)/.test(m)) return 'disagreeing';
            if (/(ugh|annoying|ugh|dumb|stupid|really\?|seriously\?)/.test(m)) return 'annoyed';
            if (/(bad|terrible|disgusting|gross|awful|hate|yuck|eww)/.test(m)) return 'upset';
            
            // Sad, Tired
            if (/(lonely|empty|nothing|sad|depressed|gone|used up|tired)/.test(m)) return 'sad';
            if (/(boring|nothing|same old|another day|repeat|monotone|exhausted|done)/.test(m)) return 'tired';
            
            // Angry, Hostile
            if (/(junk|pizza|fries|chips|burger|soda|candy|sugar|trash|garbage|crap)/.test(m)) return 'angry';
            if (/(angry|fight|hate|toxic|toxic|awful|disgusting|unacceptable)/.test(m)) return 'hostile';
            
            // Observant, Curious

            if (/(how|why|what|tell me|explain|curious|interesting|fascinated)/.test(m)) return 'curious';
            
            // Meta/Technical

        function clearStates() {
            screen.classList.remove(
                'pulse-smooth', 'flicker-gentle', 'flicker-stutter', 'flicker-irregular',
                'pulse-melancholic', 'flicker-sharp', 'flicker-aggressive', 'strobe',
                'flicker-flutter', 'pulse-reflect', 'flicker', 'shutdown', 'rattle', 'shiver'
            );
        }

        function bootAudio() {
            if (audioReady) return;
            audioReady = true;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            humOsc = audioCtx.createOscillator();
            fanOsc = audioCtx.createOscillator();
            humGain = audioCtx.createGain();
            fanGain = audioCtx.createGain();

            humOsc.type = 'sawtooth';
            fanOsc.type = 'triangle';
            humOsc.frequency.value = 58;
            fanOsc.frequency.value = 120;

            humGain.gain.value = 0.0001;
            fanGain.gain.value = 0.0001;

            humOsc.connect(humGain).connect(audioCtx.destination);
            fanOsc.connect(fanGain).connect(audioCtx.destination);
            humOsc.start();
            fanOsc.start();
        }

        function setSound(humLevel, humPitch, fanLevel, fanPitch) {
            if (!audioReady) return;
            const now = audioCtx.currentTime;
            humOsc.frequency.cancelScheduledValues(now);
            fanOsc.frequency.cancelScheduledValues(now);
            humGain.gain.cancelScheduledValues(now);
            fanGain.gain.cancelScheduledValues(now);

            humOsc.frequency.linearRampToValueAtTime(humPitch, now + 0.18);
            fanOsc.frequency.linearRampToValueAtTime(fanPitch, now + 0.18);
            humGain.gain.linearRampToValueAtTime(humLevel, now + 0.22);
            fanGain.gain.linearRampToValueAtTime(fanLevel, now + 0.22);
        }

        function react(emotion) {
            clearStates();
            const config = emotionMap[emotion] || emotionMap.neutral;
            
            mood.light = config.light;
            mood.hue = config.hue;
            mood.fan = config.fan;
            mood.fanOpacity = config.fanOpacity;
            mood.grain = config.grain;
            mood.doorClose = config.doorClose;
            mood.doorAngle = config.doorAngle;
            mood.aberration = config.aberration;
            
            console.log(config.description);

            // Apply flicker patterns
            if (config.flickerPattern === 'pulse') {
                screen.classList.add('pulse-smooth');
            } else if (config.flickerPattern === 'gentle') {
                screen.classList.add('flicker-gentle');
            } else if (config.flickerPattern === 'stutter') {
                screen.classList.add('flicker-stutter');
            } else if (config.flickerPattern === 'irregular') {
                screen.classList.add('flicker-irregular');
            } else if (config.flickerPattern === 'pulse-dim') {
                screen.classList.add('pulse-melancholic');
            } else if (config.flickerPattern === 'sharp') {
                screen.classList.add('flicker-sharp');
            } else if (config.flickerPattern === 'aggressive') {
                screen.classList.add('flicker-aggressive');
            } else if (config.flickerPattern === 'strobe') {
                screen.classList.add('strobe');
            } else if (config.flickerPattern === 'flutter') {
                screen.classList.add('flicker-flutter');
            } else if (config.flickerPattern === 'pulse-reflect') {
                screen.classList.add('pulse-reflect');
            }

            // Play sound
            setSound(config.humLevel, config.humPitch, config.fanLevel, config.fanPitch);
            
            // Auto-reset after reaction duration
            setTimeout(() => {
                clearStates();
                Object.assign(mood, emotionMap.neutral);
                setSound(emotionMap.neutral.humLevel, emotionMap.neutral.humPitch, emotionMap.neutral.fanLevel, emotionMap.neutral.fanPitch);
            }, config.duration);
        }

        function tick(time) {
            const dt = Math.min(40, time - last);
            last = time;

            const frame = dt / 16.67;
            const speed = keys.has('ShiftLeft') || keys.has('ShiftRight') ? 2.8 : 1.6;

            let moveX = 0;
            let moveZ = 0;
            let moveY = 0;

            if (keys.has('KeyW') || keys.has('ArrowUp')) moveZ += 1;
            if (keys.has('KeyS') || keys.has('ArrowDown')) moveZ -= 1;
            if (keys.has('KeyA') || keys.has('ArrowLeft')) moveX -= 1;
            if (keys.has('KeyD') || keys.has('ArrowRight')) moveX += 1;
            if (keys.has('KeyE')) moveY += 1;
            if (keys.has('KeyQ')) moveY -= 1;

            const yawRad = yaw * (Math.PI / 180);
            const forwardX = Math.sin(yawRad);
            const forwardZ = Math.cos(yawRad);
            const strafeX = Math.cos(yawRad);
            const strafeZ = -Math.sin(yawRad);

            velX += (forwardX * moveZ + strafeX * moveX) * 0.12 * speed;
            velZ += (forwardZ * moveZ + strafeZ * moveX) * 0.12 * speed;
            velY += moveY * 0.09 * speed;

            velX *= 0.82;
            velY *= 0.8;
            velZ *= 0.82;

            walkX = clamp(walkX + velX * frame, -130, 130);
            walkY = clamp(walkY + velY * frame, -68, 72);
            walkZ = clamp(walkZ + velZ * frame, -45, 220);

            shake *= 0.93;
            rumble = Math.max(0, rumble * 0.96 - 0.0025);

            const moving = Math.abs(velX) + Math.abs(velZ);
            const headBob = Math.sin(time * (0.008 + moving * 0.006)) * (0.7 + moving * 1.7);
            const jitterX = (Math.sin(time * 0.028) + Math.cos(time * 0.017)) * (0.12 + moving * 0.35);
            const jitterY = (Math.cos(time * 0.025) + Math.sin(time * 0.019)) * (0.1 + moving * 0.24);
            const impulseX = (Math.random() - 0.5) * shake * 0.18;
            const impulseY = (Math.random() - 0.5) * shake * 0.13;

            lookPulseX += (mouseX * 0.06 - lookPulseX) * 0.18;
            lookPulseY += (mouseY * 0.04 - lookPulseY) * 0.16;

            const autoYaw = Math.sin(time * 0.0006) * 0.25;
            const autoPitch = Math.cos(time * 0.0009) * 0.2;

            const camYaw = yaw + autoYaw + lookPulseX + jitterX + impulseX;
            const camPitch = clamp(pitch + autoPitch + lookPulseY + jitterY + impulseY, -4, 20);
            const camZ = mood.camZ + walkZ + Math.sin(time * 0.0019) * 6 - rumble * 14;
            const offX = -walkX + Math.sin(time * 0.011) * 1.2 + (walkZ / 600) * 12;
            const offY = -walkY + headBob - rumble * 6 + (walkZ / 700) * 8;

            // Parallax depth scaling for motion effect
            const depthScale = 1.0 + (walkZ / 1800) * 0.14;
            const depthFog = clamp(0.15 + (walkZ + 45) / 1600 + Math.abs(camPitch) / 180, 0.12, 0.46);
            const nearShadow = clamp(0.52 + (walkZ + 45) / 820, 0.36, 0.92);

            root.style.setProperty('--cam-y', `${camYaw.toFixed(3)}deg`);
            root.style.setProperty('--cam-x', `${camPitch.toFixed(3)}deg`);
            root.style.setProperty('--cam-z', `${camZ.toFixed(2)}px`);
            root.style.setProperty('--cam-off-x', `${offX.toFixed(2)}px`);
            root.style.setProperty('--cam-off-y', `${offY.toFixed(2)}px`);
            root.style.setProperty('--depth-scale', depthScale.toFixed(4));
            root.style.setProperty('--depth-fog', depthFog.toFixed(3));
            root.style.setProperty('--near-shadow', nearShadow.toFixed(3));

            root.style.setProperty('--light-opacity', mood.light.toFixed(3));
            root.style.setProperty('--light-hue', `${mood.hue}deg`);
            root.style.setProperty('--fan-speed', `${mood.fan.toFixed(2)}s`);
            root.style.setProperty('--fan-opacity', mood.fanOpacity.toFixed(3));
            root.style.setProperty('--grain-opacity', mood.grain.toFixed(3));
            root.style.setProperty('--door-close', mood.doorClose.toFixed(3));
            root.style.setProperty('--door-angle', `${mood.doorAngle.toFixed(2)}deg`);
            root.style.setProperty('--aberration', `${mood.aberration.toFixed(2)}px`);

            requestAnimationFrame(tick);
        }

        window.addEventListener('mousemove', (event) => {
            if (document.pointerLockElement === screen) {
                yaw += event.movementX * 0.08;
                pitch = clamp(pitch - event.movementY * 0.06, -6, 22);
                mouseX = 0;
                mouseY = 0;
            } else {
                mouseX = (event.clientX / window.innerWidth - 0.5) * 2;
                mouseY = (event.clientY / window.innerHeight - 0.5) * 2;
            }
        });

        window.addEventListener('keydown', (event) => {
            const active = document.activeElement;
            const isTypingTarget = active === askInput ||
                active?.tagName === 'INPUT' ||
                active?.tagName === 'TEXTAREA' ||
                active?.isContentEditable;

            if (isTypingTarget) {
                return;
            }

            keys.add(event.code);
            if (event.code === 'Space') {
                shake += 0.6;
                event.preventDefault();
            }
        });

        window.addEventListener('keyup', (event) => {
            const active = document.activeElement;
            const isTypingTarget = active === askInput ||
                active?.tagName === 'INPUT' ||
                active?.tagName === 'TEXTAREA' ||
                active?.isContentEditable;

            if (isTypingTarget) {
                return;
            }

            keys.delete(event.code);
        });

        screen.addEventListener('click', () => {
            if (document.activeElement !== askInput && document.pointerLockElement !== screen) {
                screen.requestPointerLock();
            }
        });

        window.addEventListener('wheel', (event) => {
            walkZ = clamp(walkZ + (-event.deltaY * 0.08), -45, 220);
        }, { passive: true });

        askForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const text = askInput.value.trim();
            if (!text) return;
            if (!audioReady) bootAudio();
            react(choose(text));
            askInput.value = '';
            askInput.blur();
        });

        askInput.addEventListener('focus', () => {
            if (document.pointerLockElement === screen) {
                document.exitPointerLock();
            }
        });

        window.addEventListener('pointerdown', () => {
            if (!audioReady) {
                bootAudio();
                setSound(0.013, 56, 0.006, 120);
            }
        }, { once: true });

        requestAnimationFrame(tick);
    </script>
</body>
</html>
